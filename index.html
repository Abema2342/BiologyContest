<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Биология 9 класс</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <h2>Меню</h2>
            <a href="#" onclick="showPage('home')" class="menu-item">Главная</a>
            <a href="#" onclick="startTest()" class="menu-item">Начать тест</a>
            
            <!-- Скрытая ссылка для админа -->
            <a href="#" id="admin-link" style="display:none;" onclick="openEditor()" class="menu-item">Редактор JSON</a>
            
            <!-- Форма входа / Профиль -->
            <div id="auth-section" style="margin-top: auto; padding-top: 20px; border-top: 1px solid #ddd;">
                <input type="text" id="login-input" placeholder="Логин" class="text-input">
                <input type="password" id="pass-input" placeholder="Пароль" class="text-input">
                <button onclick="performLogin()" class="btn-primary" style="width:100%; margin-top:5px;">Вход</button>
            </div>
            
            <!-- Отображение имени после входа -->
            <div id="user-info" style="display:none; margin-top:auto; padding-top:20px;">
                <p style="font-size:14px;">Привет, <span id="username-display"></span></p>
                <button onclick="logout()" class="btn-nav" style="width:100%;">Выход</button>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <header><h1>Биология 9 класс: Контест</h1></header>
            
            <!-- Страница Главная -->
            <div id="home" class="page active">
                <p>Добро пожаловать! Выберите действие в меню слева.</p>
            </div>

            <!-- Страница Теста -->
            <div id="contest" class="page">
                <div id="q-container"></div>
                <div class="navigation">
                    <button onclick="prevQ()" class="btn-nav">Назад</button>
                    <span id="counter" style="margin: 0 15px;"></span>
                    <button onclick="nextQ()" class="btn-nav">Вперёд</button>
                    <button onclick="finishTest()" class="btn-finish" style="float:right;">Завершить</button>
                </div>
            </div>

            <!-- Страница Результатов -->
            <div id="results" class="page">
                <h2>Результаты</h2>
                <div id="score-display" style="font-size:24px; color:#0056b3; margin:20px 0;"></div>
                <button onclick="goHome()" class="btn-primary">На главную</button>
            </div>

            <!-- Страница Редактора (Admin) -->
            <div id="editor" class="page">
                <h3>Редактирование вопросов (JSON)</h3>
                <textarea id="editor-area" class="text-input" style="height: 400px; font-family: monospace;"></textarea>
                <br>
                <button onclick="saveToGithub()" class="btn-primary">Сохранить в GitHub</button>
                <p id="save-status" style="color:green;"></p>
            </div>
        </main>
    </div>
    
    <!-- Подключение JS -->
    <script src="app.js"></script>
</body>
</html>
